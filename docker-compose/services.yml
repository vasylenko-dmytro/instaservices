services:
  instagram-to-kafka-service:
    image: ${GROUP_ID}/instagram-to-kafka-service:${SERVICE_VERSION}
    ports:
      - "18005:18005"
    volumes:
      - "./docker-logs:/workspace/instagram-to-kafka-service/logs"
    depends_on:
      - config-server
    env_file:
      - ../.env
    environment:
      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:18005 -Xms128m -Xmx256m"
      LOGGING_LEVEL_COM_VASYLENKO_EDU: "info"
      LOGGING_LEVEL_ROOT: "info"
      KAFKA_CONFIG_TOPIC_NAME: "ig-topic"
      KAFKA_CONFIG_BOOTSTRAP_SERVERS: "kafka-broker-1:9092"
      KAFKA_CONFIG_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      SPRING_CLOUD_CONFIG_URI: "http://config-server:8888"
    networks:
      - ${GLOBAL_NETWORK:-services}
  config-server:
    image: ${GROUP_ID}/config-server:${SERVICE_VERSION}
    ports:
      - "18006:18006"
    volumes:
      - "./docker-logs:/workspace/config-server/logs"
    env_file:
      - ../.env
    environment:
      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:18006 -Xms128m -Xmx256m"
    networks:
      - ${GLOBAL_NETWORK:-services}

networks:
  ${GLOBAL_NETWORK:-services}:
    external: true