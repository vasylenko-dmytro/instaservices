spring:
  application:
    name: instagram-to-kafka-service
  profiles:
    active: instagram_to_kafka
  cloud:
    config:
      name: instagram-to-kafka-service,config-client
      username: ${CLOUD_USERNAME}
      password: ${CLOUD_PASSWORD}
      uri: http://config-server:8888
      fail-fast: true
      retry:
        initial-interval: 2000
        max-attempts: 20
        multiplier: 1.3
