spring:
  application:
    name: configserver
  cloud:
    config:
      server:
        git:
          uri: https://github.com/vasylenko-dmytro/config-server-repository.git
          clone-on-start: true
          username: ${GHL_USER}
          password: ${GHP_TOKEN}
          default-label: master
    fail-fast: true
  security:
    user:
      name: ${CLOUD_USERNAME}
      password: ${CLOUD_PASSWORD}
encrypt:
  key: ${SECRET_KEY}
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always