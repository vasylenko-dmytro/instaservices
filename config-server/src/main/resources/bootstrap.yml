spring:
  application:
    name: configserver
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: file:///C:/Users/Legion/IdeaProjects/github/instaservices/config-server-repository
      fail-fast: true
  security:
    user:
      name: ${CLOUD_USERNAME}
      password: ${CLOUD_PASSWORD}
encrypt:
  key: ${SECRET_KEY}
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always